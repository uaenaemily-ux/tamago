             C69 45 73 50 73 56 C63 58 53 56 46 53 C50 59 50 64 48 70 C34 72 18 70 8 64 Z"
          fill="#FFFFFF"/>
    <path d="M20 56 C34 42 52 30 78 22" fill="none" stroke-width="1.8"/>
    <path d="M28 62 C40 54 52 48 66 43" fill="none" stroke-width="1.8"/>
    <path d="M14 60 C22 54 30 50 40 48" fill="none" stroke="#F2A7BC" stroke-width="1.5"/>
